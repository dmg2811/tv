<body class="hide-cursor">
<div id="screen">
  <div id="stage">
    <img id="imgA" class="layer" alt="">
    <img id="imgB" class="layer" alt="">
    <video id="vid" class="layer" muted playsinline webkit-playsinline preload="auto"></video>
  </div>
</div>
<!-- TEMPORAL (prueba de video pre-girado): caja sin giro CSS para videos ya girados; vacía y oculta en uso normal
     (el <video> de la prueba se crea solo al abrirla: en uso normal sigue habiendo UN único <video>) -->
<div id="tbox"></div>
<div id="ui">
  <div id="msg"></div>
  <div id="hint"></div>
  <pre id="hud"></pre>
  <div id="controls">
    <button type="button" id="btn-prev" tabindex="-1">ANTERIOR</button>
    <button type="button" id="btn-pause" tabindex="-1">PAUSA</button>
    <button type="button" id="btn-next" tabindex="-1">SIGUIENTE</button>
    <button type="button" id="btn-rotate" tabindex="-1">ROTAR</button>
    <button type="button" id="btn-fullscreen" tabindex="-1">PANTALLA COMPLETA</button>
    <button type="button" id="btn-sound" tabindex="-1">SONIDO: NO</button>
  </div>
  <div id="vtest">
    <button type="button" id="vt-1" tabindex="-1">1 · NORMAL</button>
    <button type="button" id="vt-2" tabindex="-1">2 · GIRADO 270°</button>
    <button type="button" id="vt-3" tabindex="-1">3 · GIRADO 90°</button>
    <button type="button" id="vt-4" tabindex="-1">4 · ANUNCIO REAL 270°</button>
    <button type="button" id="vt-flip" tabindex="-1">GIRAR VIDEO 180°</button>
    <button type="button" id="vt-rot" tabindex="-1">ROTAR PANTALLA</button>
    <button type="button" id="vt-0" tabindex="-1">0 · SALIR</button>
  </div>
</div>
